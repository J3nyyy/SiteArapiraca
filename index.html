<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arapiraca</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    #content {
      width: 100vw;
      min-height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 0.6s ease;
      padding: 20px;
    }

    .nav-link {
      color: black;
      text-decoration: none;
      margin: 0 10px;
      cursor: pointer;
    }

    .nav-link.active {
      color: green;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div id="header"></div>
  <div id="content">Carregando...</div>

  <script src="JS/LoadHeader.js"></script>
  <script>
    const pages = [
      './HTML/PAGES/home.html',
      './HTML/PAGES/headline.html',
      './HTML/PAGES/Galeria.html',
      './HTML/PAGES/Produtos.html',
      './HTML/PAGES/sobre.html',
      './HTML/PAGES/Contato.html'
    ];

    let currentPage = 0;
    const contentDiv = document.getElementById('content');

    function loadPage(index) {
      if (index < 0 || index >= pages.length) return;

      contentDiv.style.opacity = 0;
      setTimeout(() => {
        fetch(pages[index])
          .then(res => res.text())
          .then(html => {
            contentDiv.innerHTML = html;
            contentDiv.scrollTop = 0;
            contentDiv.style.opacity = 1;
            currentPage = index;
            updateActiveLink(pages[index]);

            // se for pagina contato, ele carrega o formulario
            if (pages[index].includes('Contato.html')) {
              setupForm();
            }
          })
          .catch(() => {
            contentDiv.innerHTML = `<p>Erro ao carregar página.</p>`;
            contentDiv.style.opacity = 1;
          });
      }, 300);
    }

    // Formulario contato
    function setupForm() {
      const form = document.getElementById('formulario');
      const status = document.createElement('p');
      status.id = 'mensagem-status';
      status.style.marginTop = '10px';
      form.appendChild(status);

      emailjs.init('J8rHi3zEaQ2e9PCqD');

      form.addEventListener('submit', async function (event) {
        event.preventDefault();
        status.textContent = 'Enviando...';

        const fileInput = form.querySelector('input[name="arquivo"]');
        const file = fileInput?.files[0];

        let fileLink = '';

        if (file) {
          const formData = new FormData();
          formData.append('file', file);

          try {
            const response = await fetch('https://file.io', {
              method: 'POST',
              body: formData
            });
            const data = await response.json();

            if (data.success) {
              fileLink = data.link;
            } else {
              status.textContent = 'Erro ao enviar arquivo.';
              return;
            }
          } catch (error) {
            status.textContent = 'Erro ao conectar com file.io.';
            return;
          }
        }

        // Monta os parâmetros que serão enviados para o EmailJS
        const params = {
          nome: form.nome.value,
          email: form.email.value,
          telefone: form.telefone.value,
          assunto: form.assunto.value,
          mensagem: form.mensagem.value,
          arquivo: fileLink || 'Nenhum arquivo enviado.'
        };

        emailjs.send('service_izjakrc', 'template_3sfsp3n', params)
          .then(() => {
            status.textContent = 'Mensagem enviada com sucesso! Obrigado pelo contato.';
            form.reset();
          })
          .catch((error) => {
            status.textContent = 'Erro ao enviar mensagem.';
            console.error('EmailJS error:', error);
          });
      });
    }

    function updateActiveLink(pagePath) {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.page === pagePath);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPage(currentPage);

      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('nav-link')) {
          e.preventDefault();
          const page = e.target.dataset.page;
          const index = pages.indexOf(page);
          if (index !== -1) loadPage(index);
        }
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</body>

</html>
