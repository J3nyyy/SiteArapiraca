<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arapiraca</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    #content {
      /* width: 100%; */
      min-height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    .nav-link {
      color: black;
      text-decoration: none;
      margin: 0 10px;
      cursor: pointer;
    }

    .nav-link.active {
      color: green;
      font-weight: bold;
    }


    /* popup */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    .popup {
      position: relative;
      background: white;
      padding: 40px;
      text-align: center;
      width: 90%;
      max-width: 600px;
      border-radius: 8px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    .popup-logo {
      max-width: 200px;
      margin-bottom: 20px;
    }

    .popup-text {
      font-size: 16px;
      margin-bottom: 20px;
      color: #333;
    }

    .popup-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .btn-yes {
      background-color: #b8d8b8;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 10px black;
    }

    .btn-no {
      background-color: #e6d3a3;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      
    }

    .popup-warning {
      font-size: 12px;
      color: #666;
      line-height: 1.4;
    }

    .leaf {
      position: absolute;
      width: 150px;
      pointer-events: none;
    }

    .leaf-left {
      bottom: -50px;
      left: -50px;
    }

    .leaf-right {
      top: -50px;
      right: -50px;
    }

    .blurred {
      filter: blur(5px);
    }
  </style>
</head>

<body>
  <div id="popup-overlay" class="popup-overlay">
    <div class="popup">
      <img src="Imagens/Imagens novas/ArapiracaLogo.png" alt="Logo" class="popup-logo">

      <p class="popup-text">Confirme que você atingiu a maioridade:</p>

      <div class="popup-buttons">
        <button class="btn-yes" onclick=permitirAcesso()>Sim, tenho 18+</button>
        <button class="btn-no" onclick=negarAcesso()>Não, tenho 18-</button>
      </div>

      <p class="popup-warning">
        A verificação é feita a cada sessão aberta.<br>
        Ao entrar neste site você concorda com os Termos de uso e política de privacidade.
      </p>

      <img src="Imagens/Imagens novas/folha18+.png" class="leaf leaf-left">
      <img src="Imagens/Imagens novas/folha218+.png" class="leaf leaf-right">
    </div>
  </div>
  <div id="header"></div>
  <div id="content">Carregando...</div>

  <script src="JS/LoadHeader.js"></script>
  <script>
    document.getElementById("content").classList.add("blurred");

    function permitirAcesso() {
      document.getElementById("popup-overlay").style.display = "none";
      document.getElementById("content").classList.remove("blurred");
    }

    function negarAcesso() {
        window.location.href = "https://www.google.com";
    }
  </script>
  <script>
    const pages = [
      './HTML/PAGES/home.html',
      './HTML/PAGES/headline.html',
      './HTML/PAGES/Galeria.html',
      './HTML/PAGES/Produtos.html',
      './HTML/PAGES/sobre.html',
      './HTML/PAGES/Contato.html'
    ];

    let currentPage = 0;
    const contentDiv = document.getElementById('content');

    async function loadPage(index) {
      if (index < 0 || index >= pages.length) return;

      // 1. Começa escondendo o conteúdo
      contentDiv.style.opacity = 0;

      // Pequeno delay para garantir que o CSS perceba a mudança
      await new Promise(resolve => setTimeout(resolve, 300));

      try {
        // 2. Busca a página
        const res = await fetch(pages[index]);
        const html = await res.text();

        // 3. Insere o conteúdo
        contentDiv.innerHTML = html;
        contentDiv.scrollTop = 0;
        currentPage = index;
        updateActiveLink(pages[index]);

        // 4. Reativa funcionalidades específicas (como no contato)
        if (pages[index].includes('Contato.html')) {
          const assunto = contentDiv.querySelector('#assunto');
          const campoArquivo = contentDiv.querySelector('#campo-arquivo');
          if (assunto && campoArquivo) {
            assunto.addEventListener('change', function () {
              campoArquivo.style.display = this.value === 'Trabalhe Conosco' ? 'block' : 'none';
            });
          }
        }
      } catch (err) {
        contentDiv.innerHTML = `<p>Erro ao carregar página.</p>`;
      }

      // 5. Mostra o conteúdo com transição
      contentDiv.style.opacity = 1;
    }

    // // Formulario contato
    // function setupForm() {

    // }

    function updateActiveLink(pagePath) {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.page === pagePath);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPage(currentPage);

      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('nav-link')) {
          e.preventDefault();
          const page = e.target.dataset.page;
          const index = pages.indexOf(page);
          if (index !== -1) loadPage(index);
        }
      });
    });
  </script>
</body>

</html>
