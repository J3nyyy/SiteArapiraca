<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arapiraca</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        #content {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 1;
            transition: opacity 0.6s ease;
            overflow-y: auto; /* Permite scroll interno */
        }

        .nav-link {
            color: black;
            text-decoration: none;
            margin: 0 10px;
        }

        .nav-link.active {
            color: green;
            font-weight: bold;
        }

        /* Indicador de scroll */
        .scroll-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.5);
            color: white;
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }

        .scroll-hint.visible {
            opacity: 1;
        }
    </style>
</head>

<body>
    <div id="header"></div>
    <script src="JS/LoadHeader.js"></script>
    <div id="content">Carregando...</div>
    <div class="scroll-hint">Role para navegar</div>

    <script> 
           const pages = [
        'HTML/Pages/home.html',
        'HTML/Pages/headline.html',
        'HTML/Pages/Galeria.html',
        'HTML/Pages/Produtos.html',
        'HTML/Pages/sobre.html',
        'HTML/Pages/Contato.html'
    ];

    let currentPage = 0;
    let isLoading = false;

    const contentDiv = document.getElementById('content');
    const scrollHint = document.querySelector('.scroll-hint');

    function setActiveNavLink(pagePath) {
        document.querySelectorAll('.nav-link').forEach(link => {
            link.classList.toggle('active', link.dataset.page === pagePath);
        });
    }

    function showScrollHintIfNeeded() {
        if (!scrollHint) return;
        const needsScroll = contentDiv.scrollHeight > contentDiv.clientHeight;
        scrollHint.style.display = needsScroll ? 'none' : 'block';
    }

    function fadeOutContent(callback) {
        contentDiv.style.opacity = 0;
        setTimeout(callback, 400); // tempo menor pro fadeOut
    }

    function fadeInContent() {
        contentDiv.style.opacity = 1;
    }

    function loadPage(index) {
        if (isLoading || index < 0 || index >= pages.length) return;
        isLoading = true;

        fadeOutContent(() => {
            fetch(pages[index])
                .then(response => {
                    if (!response.ok) throw new Error('Erro ao carregar página');
                    return response.text();
                })
                .then(html => {
                    contentDiv.innerHTML = html;
                    contentDiv.scrollTop = 0;
                    fadeInContent();
                    currentPage = index;
                    setActiveNavLink(pages[index]);
                    showScrollHintIfNeeded();
                })
                .catch(error => {
                    contentDiv.innerHTML = `<p>Erro ao carregar a página: ${error.message}</p>`;
                    fadeInContent();
                })
                .finally(() => {
                    isLoading = false;
                });
        });
    }

    // Opcional: navegação via seta para baixo/cima ou swipe
    function initScrollNavigation() {
        window.addEventListener('wheel', (e) => {
            if (isLoading) return;
            if (e.deltaY > 50) loadPage(currentPage + 1);
            else if (e.deltaY < -50) loadPage(currentPage - 1);
        });
    }

    // Inicialização
    document.addEventListener('DOMContentLoaded', () => {
        loadPage(currentPage);
        initScrollNavigation();

        document.querySelectorAll('.nav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const pageIndex = pages.indexOf(link.dataset.page);
                if (pageIndex !== -1) loadPage(pageIndex);
            });
        });
    });
    </script>
</body>
</html>
