<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arapiraca</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      font-family: sans-serif;
    }

    #content {
      /* width: 100%; */
      min-height: 75vh;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    .nav-link {
      color: black;
      text-decoration: none;
      margin: 0 10px;
      cursor: pointer;
    }

    .nav-link.active {
      color: green;
      font-weight: bold;
    }


    /* Fundo borrado */
    .blurred {
      filter: blur(5px);
      pointer-events: none;
      user-select: none;
    }

    /* Overlay do popup */
    .popup-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    /* Caixa do popup */
    .popup {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      max-width: 300px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .popup h2 {
      margin-bottom: 15px;
    }

    .popup button {
      padding: 10px 15px;
      margin: 5px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .btn-yes {
      background-color: green;
      color: white;
    }

    .btn-no {
      background-color: red;
      color: white;
    }
  </style>
</head>

<body>
  <div id="popup-overlay" class="popup-overlay">
    <div class="popup">
      <h2>Você tem mais de 18 anos?</h2>
      <button class="btn-yes" onclick="permitirAcesso()">Sim</button>
      <button class="btn-no" onclick="negarAcesso()">Não</button>
    </div>
  </div>
  <div id="header"></div>
  <div id="content">Carregando...</div>

  <script src="JS/LoadHeader.js"></script>
  <script>
    document.getElementById("content").classList.add("blurred");

    function permitirAcesso() {
      document.getElementById("popup-overlay").style.display = "none";
      document.getElementById("content").classList.remove("blurred");
    }

    function negarAcesso() {
      document.body.innerHTML = "<h1 style='text-align:center; margin-top:50px;'>Acesso negado</h1>";
    }
  </script>
  <script>
    const pages = [
      './HTML/PAGES/home.html',
      './HTML/PAGES/headline.html',
      './HTML/PAGES/Galeria.html',
      './HTML/PAGES/Produtos.html',
      './HTML/PAGES/sobre.html',
      './HTML/PAGES/Contato.html'
    ];

    let currentPage = 0;
    const contentDiv = document.getElementById('content');

    function loadPage(index) {
      if (index < 0 || index >= pages.length) return;

      contentDiv.style.opacity = 0;
      setTimeout(() => {
        fetch(pages[index])
          .then(res => res.text())
          .then(html => {
            contentDiv.innerHTML = html;
            contentDiv.scrollTop = 0;
            contentDiv.style.opacity = 1;
            currentPage = index;
            updateActiveLink(pages[index]);

            if (pages[index].includes('Contato.html')) {
              // Aguarda o conteúdo ser renderizado antes de acessar os elementos
              setTimeout(() => {
                const assunto = contentDiv.querySelector('#assunto');
                const campoArquivo = contentDiv.querySelector('#campo-arquivo');

                if (assunto && campoArquivo) {
                  assunto.addEventListener('change', function () {
                    campoArquivo.style.display = this.value === 'Trabalhe Conosco' ? 'block' : 'none';
                  });
                }
              }, 100); // tempo para garantir que o HTML foi injetado
            }
          })
          .catch(() => {
            contentDiv.innerHTML = `<p>Erro ao carregar página.</p>`;
            contentDiv.style.opacity = 1;
          });
      }, 300);
    }

    // // Formulario contato
    // function setupForm() {

    // }

    function updateActiveLink(pagePath) {
      document.querySelectorAll('.nav-link').forEach(link => {
        link.classList.toggle('active', link.dataset.page === pagePath);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadPage(currentPage);

      document.addEventListener('click', (e) => {
        if (e.target.classList.contains('nav-link')) {
          e.preventDefault();
          const page = e.target.dataset.page;
          const index = pages.indexOf(page);
          if (index !== -1) loadPage(index);
        }
      });
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</body>

</html>
