<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="Css/StyleProdutos.css">

</head>

<body>


    <section id="produto">
        <div class="titulo-container">
            <h2 class="titulo-produto">Nossos Produtos</h2>
            <span class="linha-verde"></span>
        </div>

        <div class="produto">
            <div class="texto">
                <h3 class="titulo">Pedaços</h3>
                <span class="linha-verde"></span>
                <p class="descricao">Descrição</p>
            </div>

            <div class="Imagem">
                <img id="frame" src="Imagens/Imagens novas/pedacos.png" alt="ImagemPedacosProd" />
            </div>
        </div>



        <div class="produto">
            <div class="texto">

                <h3 class="titulo">Desfiados</h3>
                <span class="linha-verde"></span>
                <p class="descricao">Descrição</p>
            </div>

            <div class="Imagem">
                <img class="img-produto" src="Imagens/Imagens novas/desfiados1.png" alt="ImagemDesfiadosProd" />
            </div>
        </div>

        <div class="produto">
            <div class="texto">

                <h3 class="titulo">Corda</h3>
                <span class="linha-verde"></span>
                <p class="descricao">Descrição</p>

            </div>


            <div class="Imagem">
                <img class="img-produto" src="Imagens/Imagens novas/corda1.png" alt="ImagemCordasProd" />
            </div>
        </div>

        <div class="produto">
             <div class="texto">

                <h3 class="titulo">Palha</h3>
                <span class="linha-verde"></span>
                <p class="descricao">Descrição</p>

            </div>

            <div class="Imagem">
                <img class="img-produto" src="Imagens/Imagens novas/palhas1.png" alt="ImagemPalhasProd" />
            </div>
        </div>

        <div class="produto">
            <div class="texto">

                <h3 class="titulo">Papel</h3>
                <span class="linha-verde"></span>
                <p class="descricao">Descrição</p>

            </div>

            <div class="Imagem">
                <img class="img-produto" src="Imagens/Imagens novas/papel1.png" alt="ImagemPapelProd" />
            </div>
        </div>
    </section>

    <script src="LoadHeader.js"></script>
</body>

</html>
