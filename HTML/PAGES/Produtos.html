<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produtos</title>
    <link rel="stylesheet" href="Css/StyleProdutos.css">
    
</head>
<body>

    
    <section id="produto">
  <div class="titulo-container">
    <h2 class="titulo-produto">Nossos Produtos</h2>
    <span class="linha-verde"></span>
  </div>

        <div class="produto-grid">
            <div class="texto"> 
                <h3>Pedaços</h3>
                <p>Descrição</p>
            </div>

            <div class="Imagem">
                <img id="frame" src="Imagens/Imagens novas/pedacos.png" alt="ImagemPedacosProd" />
            </div>
        </div>



        <div class="produto-desfiados">
            <div class="texto2">
            
            <h3>Desfiados</h3>
            <p>Descrição</p>

                <img class="img-produto" src="Imagens/Imagens novas/desfiados1.png" alt="ImagemDesfiadosProd" />

        </div>

        <div class="produto-cordas">
            <div class="texto3">

        </div>

        <div class="produto-palhas">
            <div class="texto4">
            
            <h3>Palhas</h3>
            <p>Descrição</p>
            </div>

            <div class="Imagem4">
                <img class="img-produto" src="Imagens/Imagens novas/palhas1.png" alt="ImagemPalhasProd" />
            </div>
        </div>

        <div class="produto-papel">
            <div class="texto5">
            
            <h3>Papel</h3>
            <p>Descrição</p>
            </div>

            <div class="Imagem5">
                <img class="img-produto" src="Imagens/Imagens novas/papel1.png" alt="ImagemPapelProd" />
            </div>
        </div>

    <script src="LoadHeader.js"></script>

</html>
